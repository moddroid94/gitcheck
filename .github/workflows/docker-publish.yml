name: Build and Push Docker Image

# Builds on published GitHub releases and manual dispatch, not on every push.
# Releases created by a GITHUB_TOKEN do not emit events that trigger workflows,
# so .github/workflows/release.yml dispatches this workflow explicitly.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: moddroid94/gitcheck
  GHCR_IMAGE: ghcr.io/moddroid94/gitcheck

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Docker tags cannot contain '+', so drop semver build metadata.
          VERSION="${VERSION%%+*}"
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z_][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag derived from package.json: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
